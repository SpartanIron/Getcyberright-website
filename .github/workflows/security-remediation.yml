name: Security remediation (temporary)

on:
  push:
    branches: [ "security/dependency-remediation-1" ]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Fix root dependencies (non-breaking)
        run: |
          npm install
          npm audit fix || true
          echo "===== REMAINING ROOT AUDIT ====="
          npm audit || true

      - name: Fix mockup-sandbox dependencies (non-breaking)
        working-directory: artifacts/mockup-sandbox
        run: |
          npm install
          npm audit fix || true
          echo "===== REMAINING SANDBOX AUDIT ====="
          npm audit || true

      - name: Build
        run: npm run build --if-present

      - name: Commit lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json artifacts/mockup-sandbox/package.json artifacts/mockup-sandbox/package-lock.json
          git diff --cached --quiet || git commit -m "fix(deps): resolve Dependabot security alerts via npm audit fix"
          git push
