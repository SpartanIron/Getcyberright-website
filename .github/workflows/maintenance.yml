# TEMPORARY helper workflow: remove before merging.
name: Maintenance investigation (temporary)
on:
  push:
    branches: [ "chore/deps-maintenance" ]
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: A openai any reference
        run: grep -rn -i "openai" --include=*.ts --include=*.tsx --include=*.mjs --include=*.js --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist . | grep -v -i "AI_INTEGRATIONS_OPENAI\|openai.com" | head -40
      - name: B neon / drizzle config / db driver
        run: |
          cat drizzle.config.ts
          grep -rn -E "from ['\"](postgres|pg|drizzle-orm/[a-z-]+)['\"]|import\(['\"]@neondatabase" --include=*.ts --exclude-dir=node_modules . | head -20
      - name: C archiver route
        run: sed -n '5440,5520p' server/routes.ts
      - name: D downloadSocialImage + bulk upload call sites
        run: |
          sed -n '50,99p' server/imageStorage.ts
          sed -n '210,245p' server/routes.ts
          sed -n '315,335p' server/index.ts
      - name: E tests and test runner
        run: |
          head -30 tests/shield-security.test.ts
          grep -rn "node:test\|vitest\|jest" tests | head
      - name: F dependabot PR package.json diffs
        run: |
          git fetch --no-tags origin '+refs/heads/dependabot/*:refs/remotes/origin/dependabot/*'
          for b in $(git branch -r | grep dependabot); do echo "===== $b ====="; git diff origin/main...$b -- package.json .github | head -30; done
