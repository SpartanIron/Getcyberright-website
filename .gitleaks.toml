# Gitleaks configuration for GetCyberRight
#
# PURPOSE: Suppress false positives for PUBLIC identifiers only.
# These are OAuth client IDs, publishable keys, and site keys that are
# designed to be public-facing. They grant no access without their
# corresponding secrets.
#
# IMPORTANT: Never add allowlist rules for values containing:
#   _SECRET, _PASSWORD, _TOKEN, _PRIVATE_KEY, sk_live_, sk_test_
# Those are real credentials and must remain in Replit Secrets.

[extend]
useDefault = true

[allowlist]
description = "Public client IDs, site keys, and publishable keys (not secrets)"
paths = []

[[allowlist.rules]]
description = "LinkedIn OAuth Client ID (public identifier)"
id = "generic-api-key"
path = '''.replit'''
regex = '''LINKEDIN_CLIENT_ID'''

[[allowlist.rules]]
description = "Facebook App ID (public identifier)"
id = "generic-api-key"
path = '''.replit'''
regex = '''FACEBOOK_APP_ID'''

[[allowlist.rules]]
description = "Threads App ID (public identifier)"
id = "generic-api-key"
path = '''.replit'''
regex = '''THREADS_APP_ID'''

[[allowlist.rules]]
description = "reCAPTCHA site key (public by design)"
id = "generic-api-key"
path = '''.replit'''
regex = '''VITE_RECAPTCHA_SITE_KEY'''

[[allowlist.rules]]
description = "Stripe publishable key (public by design)"
id = "generic-api-key"
path = '''.replit'''
regex = '''STRIPE_PUBLISHABLE_KEY'''

[[allowlist.rules]]
description = "Buffer organization ID (public identifier)"
id = "generic-api-key"
path = '''.replit'''
regex = '''BUFFER_ORG_ID'''
